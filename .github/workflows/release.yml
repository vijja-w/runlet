name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22.23.2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --omit=optional --ignore-scripts

      - name: Run tests
        run: npm run check

      - name: Download target Node.js runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/node-runtimes
          cd build/node-runtimes
          base="https://nodejs.org/download/release/v${NODE_VERSION}"
          files=(
            "node-v${NODE_VERSION}-darwin-arm64.tar.xz"
            "node-v${NODE_VERSION}-darwin-x64.tar.xz"
            "node-v${NODE_VERSION}-linux-x64.tar.xz"
            "node-v${NODE_VERSION}-win-x64.zip"
          )
          for file in "${files[@]}"; do
            curl -fsSLO "$base/$file"
          done
          curl -fsSLO "$base/SHASUMS256.txt"
          for file in "${files[@]}"; do
            grep "  $file\$" SHASUMS256.txt
          done > selected-SHASUMS256.txt
          sha256sum --check selected-SHASUMS256.txt

          tar -xJf "node-v${NODE_VERSION}-darwin-arm64.tar.xz"
          tar -xJf "node-v${NODE_VERSION}-darwin-x64.tar.xz"
          tar -xJf "node-v${NODE_VERSION}-linux-x64.tar.xz"
          unzip -q "node-v${NODE_VERSION}-win-x64.zip"

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release.mjs --platform darwin --arch arm64 --node "build/node-runtimes/node-v${NODE_VERSION}-darwin-arm64/bin/node"
          node scripts/build-release.mjs --platform darwin --arch x64 --node "build/node-runtimes/node-v${NODE_VERSION}-darwin-x64/bin/node"
          node scripts/build-release.mjs --platform linux --arch x64 --node "build/node-runtimes/node-v${NODE_VERSION}-linux-x64/bin/node"
          node scripts/build-release.mjs --platform windows --arch x64 --node "build/node-runtimes/node-v${NODE_VERSION}-win-x64/node.exe"

      - name: Smoke-test packaged Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          launcher="$PWD/build/release/runlet-linux-x64/runlet/runlet"
          export RUNLET_STATE_DIR="$RUNNER_TEMP/runlet-release-state"
          export RUNLET_NO_OPEN=1
          export PORT=4197
          cleanup() { "$launcher" kill >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "$launcher" version | grep '^0.7.0$'
          "$launcher"
          curl -fsS http://127.0.0.1:4197/api/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:4197/ | grep '<title>Runlet</title>'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1.0"}}}' \
            | "$launcher" mcp \
            | grep '"name":"runlet"'
          "$launcher" kill
          trap - EXIT

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum runlet-* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Runlet $GITHUB_REF_NAME"
